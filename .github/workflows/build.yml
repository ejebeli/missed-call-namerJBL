name: Generate Release Keystore
run-name: |
        keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass password123 -keypass password123 -dname "CN=Ehsan Jebeli, OU=Development, O=JBL, L=Tehran, S=Tehran, C=IR"
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass password123 -keypass password123 -dname "CN=MissedCallEJ, OU=EhsanJebeli, O=Personal, L=Tehran, S=Tehran, C=IR"

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: missed-call-release
        path: app/build/outputs/apk/release/app-release.apk
